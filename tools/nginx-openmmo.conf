# tools/nginx-openmmo.conf
#
# OpenMMO Preview —— 唯一基础设施 owner 的 nginx 配置
#
# 设计原则（对应本轮 hotfix）：
#   - nginx 是 CNB Preview 唯一的长期 foreground owner
#   - 监听 0.0.0.0:8686（CNB only-preview 要求业务端口 8686）
#   - /health 必须始终返回 200（基础设施存活探针，与游戏应用状态解耦）
#   - / 至少返回合法 HTML（应用未 ready 时也绝不 404）
#   - 静态资源以项目根为 document root
#
# 该文件通过 `nginx -c <绝对路径>` 加载，不依赖默认 /etc/nginx/nginx.conf。

worker_processes auto;
pid /tmp/openmmo-nginx.pid;
error_log /tmp/openmmo-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # 统一日志到 stdout/stderr，便于外层 CNB runner 观察
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 0.0.0.0:8686;
        server_name _;

        root  /workspace;
        index index.html;

        # 基础设施存活探针：始终 200，与游戏应用状态无关
        location = /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # 根路径：始终返回合法 HTML（Preparing/失败占位由 app 前端处理）
        location = / {
            try_files /index.html =404;
        }

        # 静态资源：JS 以 ES module 加载，mime.types 保证 .js → text/javascript
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
