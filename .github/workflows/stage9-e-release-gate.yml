name: stage9-e-release-gate

on:
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run existing full historical gate
        run: npm run gate:stage8-2G
      - name: Run Stage 9-D browser regression
        run: npm run browser:stage9-D
      - name: Run Stage 9-E Stage Gate browser closure
        run: npm run browser:stage9-E
      - name: Verify clean clone of immutable final HEAD
        env:
          IRON_CLEAN_CLONE_RESULT_PATH: artifacts/stage9-e-release/clean_clone_result.json
          IRON_CLEAN_CLONE_TIMEOUT_MS: 3600000
        timeout-minutes: 70
        run: npm run verify:clean-clone
      - name: Upload Stage 9-E Release Gate closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-e-release-gate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage9_e_*.json
            stage9_d_*.json
            stage8_2g_dc1_*.json
            artifacts/stage9-e-release/
          if-no-files-found: warn
          retention-days: 30
