name: stage9-e-stage-gate

on:
  workflow_dispatch:

jobs:
  stage-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Stage 9-E node core and targeted regressions
        run: npm run test:stage9-E
      - name: Stage 9-E browser evidence and tamper gate
        run: npm run browser:stage9-E
      - name: Upload Stage 9-E Stage Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-e-stage-gate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage9_e_*.json
            screenshots/stage9-E/
          if-no-files-found: warn
          retention-days: 30
