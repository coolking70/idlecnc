name: stage9-d-fast

on:
  push:
    branches: [auto/stage9-d-battle-salvage]
  workflow_dispatch:

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Stage 9-D Fast Gate
        run: npm run test:stage9-D:fast
      - name: Upload Stage 9-D core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-d-fast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9_d_core_machine_evidence.json
          if-no-files-found: warn
          retention-days: 30
